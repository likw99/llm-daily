[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-daily"
version = "0.9.0"
description = "Open-source agent that collects AI news and writes a daily newsletter with your own LLM key"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1,<3",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "praw>=7.8",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "huggingface-hub>=0.29",
    "pyyaml>=6.0",
    "markdown>=3.11.2",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
x = ["tweepy>=4.15"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
llm-daily = "llm_daily.cli:main"
llm-daily-site = "llm_daily.site:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_daily"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
# Pyflakes + import errors only; style cleanup of the legacy collectors is a separate task.
select = ["F", "E9"]
